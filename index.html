/* ============================================================================
   UTILITARE - RANDOMIZARE
   ============================================================================ */

function shuffle(array) {
  // Fisher-Yates shuffle, modifică array-ul in-place
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randInt(min, max) {
  // întreg între min și max inclusiv
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ============================================================================
   ASIGNARE GRUP (random echilibrat cu URL override)
   ============================================================================ */

// Verifică dacă există ?cond=N în URL pentru a forța o condiție anume
function determinaConditie() {
  const params = new URLSearchParams(window.location.search);
  const condParam = params.get('cond');
  if (condParam && ['1', '2', '3', '4'].includes(condParam)) {
    return parseInt(condParam);
  }
  // Random pur (1-4)
  return randInt(1, 4);
}

const CONDITII_DICT = {
  1: { str: '1-focal-highload',    focal: true,  high_load: true  },
  2: { str: '2-focal-lowload',     focal: true,  high_load: false },

  4: { str: '4-nonfocal-lowload',  focal: false, high_load: false }

const DEADLINE_MS   = 1300;   // high-load
const LOWLOAD_MS    = 2500;   // low-load
const TRIAL_DURATION = HIGH_LOAD ? DEADLINE_MS : LOWLOAD_MS;

/* ============================================================================
   CONSTRUCȚIA LISTEI DE STIMULI EXPERIMENTALI
   ============================================================================ */

function construiesteListaStimuli(focalCue) {
  // Echivalent cu construieste_lista_stimuli din Python
  let pmPool;
  if (focalCue) {
    pmPool = shuffle(PM_CUES_ANIMALE);
  } else {
    pmPool = shuffle(PM_CUES_M);
  }

  // Calculează pozițiile celor 15 indicii PM
  const pozitiiPm = [];
  let pozCurenta = randInt(5, 15);
  for (let i = 0; i < 15; i++) {
    if (i > 0) {
      pozCurenta += randInt(10, 25);
    }
    pozitiiPm.push(pozCurenta);
  }

  const maxPos = Math.max(...pozitiiPm);
  let totalStimuli = maxPos + randInt(5, 15);
  totalStimuli = Math.max(totalStimuli, 280);

  // Construiește pool-ul de stimuli non-PM
  const repetVIU = [];
  const repetNEV = [];
  for (let i = 0; i < 4; i++) {
    repetVIU.push(...VIU_NON_ANIMALE);
    repetNEV.push(...NEVIU);
  }
  const poolViu = repetVIU.slice(0, totalStimuli);
  const poolNeviu = repetNEV.slice(0, totalStimuli);
  const poolNonPm = shuffle([...poolViu, ...poolNeviu]);

  // Construiește lista finală
  const lista = [];
  let idxNonPm = 0;
  const setVIU = new Set(VIU_NON_ANIMALE);

  for (let pozitie = 0; pozitie < totalStimuli; pozitie++) {
    if (pozitiiPm.includes(pozitie)) {
      const idxCue = pozitiiPm.indexOf(pozitie);
      const cuvantPm = pmPool[idxCue];

      if (focalCue) {
        // Animal → viu
        lista.push({
          cuvant: cuvantPm,
          categorie: 'viu',
          este_pm_cue: true,
          raspuns_corect_ongoing: 'v',
          tip_afisare: 'normal'
        });
      } else {
        // Cuvânt cu M
        const categorieM = PM_CUES_M_CATEGORIE[cuvantPm];
        lista.push({
          cuvant: cuvantPm,
          categorie: categorieM,
          este_pm_cue: true,
          raspuns_corect_ongoing: categorieM === 'viu' ? 'v' : 'n',
          tip_afisare: 'normal'
        });
      }
    } else {
      if (idxNonPm < poolNonPm.length) {
        const cuvant = poolNonPm[idxNonPm];
        idxNonPm++;
        const categorie = setVIU.has(cuvant) ? 'viu' : 'neviu';
        lista.push({
          cuvant: cuvant,
          categorie: categorie,
          este_pm_cue: false,
          raspuns_corect_ongoing: categorie === 'viu' ? 'v' : 'n',
          tip_afisare: 'normal'
        });
      }
    }
  }

  return lista.slice(0, 280);
}

/* ============================================================================
   GENEREAZĂ LISTA DE ANTRENAMENT (20 stimuli)
   ============================================================================ */

function construiesteAntrenament() {
  const lista = [];
  for (let i = 0; i < 10; i++) {
    lista.push({
      cuvant: randChoice(VIU_NON_ANIMALE),
      categorie: 'viu',
      este_pm_cue: false,
      raspuns_corect_ongoing: 'v',
      tip_afisare: 'normal'
    });
    lista.push({
      cuvant: randChoice(NEVIU),
      categorie: 'neviu',
      este_pm_cue: false,
      raspuns_corect_ongoing: 'n',
      tip_afisare: 'normal'
    });
  }
  return shuffle(lista);
}

/* ============================================================================
   FUNCȚIE HELPER - calculează rezultatele și salvează în date_pm
   ============================================================================ */
function salveazaRezultatPM(stimulInfo, esteAntrenament, prima_tasta, prima_rt, a_doua_tasta, a_doua_rt) {
  // Combină prima + a doua tastă pentru a determina raspuns_ongoing și raspuns_pm
  let raspuns_ongoing = null;
  let timp_reactie    = null;
  let raspuns_pm      = false;

  // Procesare prima tastă
  if (prima_tasta === 'v' || prima_tasta === 'n') {
    raspuns_ongoing = prima_tasta;
    timp_reactie    = prima_rt;
  } else if (prima_tasta === 'z') {
    raspuns_pm = true;
  }
  // Procesare a doua tastă (dacă există)
  if (a_doua_tasta) {
    if ((a_doua_tasta === 'v' || a_doua_tasta === 'n') && raspuns_ongoing === null) {
      raspuns_ongoing = a_doua_tasta;
      timp_reactie    = (prima_rt || 0) + (a_doua_rt || 0);
    }
    if (a_doua_tasta === 'z') {
      raspuns_pm = true;
    }
  }

  const corect_ongoing = (raspuns_ongoing === stimulInfo.raspuns_corect_ongoing);
  let corect_pm, tip_pm;
  if (stimulInfo.este_pm_cue) {
    corect_pm = raspuns_pm;
    tip_pm = raspuns_pm ? 'hit' : 'miss';
  } else {
    corect_pm = !raspuns_pm;
    tip_pm = raspuns_pm ? 'false_alarm' : 'correct_rejection';
  }

  const row = {
    participant_id:         PARTICIPANT_ID,
    conditie:               CONDITIE_STR,
    focal_cue:              FOCAL_CUE ? 'True' : 'False',
    cognitive_load:         HIGH_LOAD ? 'True' : 'False',
    cuvant:                 stimulInfo.cuvant,
    categorie:              stimulInfo.categorie,
    este_pm_cue:            stimulInfo.este_pm_cue ? 'True' : 'False',
    tip_afisare:            stimulInfo.tip_afisare,
    raspuns_ongoing:        raspuns_ongoing || '',
    raspuns_corect_ongoing: stimulInfo.raspuns_corect_ongoing,
    corect_ongoing:         corect_ongoing ? 'True' : 'False',
    timp_reactie_ms:        timp_reactie !== null ? timp_reactie.toFixed(2) : '',
    raspuns_pm:             raspuns_pm ? 'True' : 'False',
    corect_pm:              corect_pm ? 'True' : 'False',
    tip_pm:                 tip_pm,
    este_antrenament:       esteAntrenament ? 'True' : 'False'
  };

  date_pm.push(row);
  console.log(`[TRIAL] cuvant="${stimulInfo.cuvant}" | așteptat=${stimulInfo.raspuns_corect_ongoing} | tasta1=${prima_tasta||'(-)'} | tasta2=${a_doua_tasta||'(-)'} | ongoing=${raspuns_ongoing||'(-)'} | pm=${raspuns_pm} | corect_ong=${corect_ongoing}`);

  return row;
}

/* ============================================================================
   CONSTRUIEȘTE TRIAL PM - un singur trial per cuvânt (Z-only PM response)
   - Participant apasă V sau N pentru sarcina ongoing
   - Participant apasă Z când vede indiciul PM (fără V/N obligatoriu)
   - Structura e identică pentru antrenament și bloc principal
   ============================================================================ */
function construiesteTrialPM(stimulInfo, esteAntrenament) {
  const trialuri = [];

  // Fixație 300ms
  trialuri.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixatie">+</div>',
    choices: 'NO_KEYS',
    trial_duration: 300
  });

  // Trial unic: acceptă V, N sau Z
  trialuri.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stim-cuvant">${stimulInfo.cuvant}</div>`,
    choices: ['v', 'V', 'n', 'N', 'z', 'Z'],
    response_ends_trial: true,
    trial_duration: TRIAL_DURATION,
    allow_held_key: true,
    on_finish: function(data) {
      const tasta = (data.response || '').toLowerCase();
      const row = salveazaRezultatPM(stimulInfo, esteAntrenament, tasta, data.rt, null, null);
      data.csv_row = 'PM';
      for (const k in row) data[k] = row[k];
      document.title = `[DBG] "${stimulInfo.cuvant}" | apăsat="${tasta||'NIMIC'}" | pm_cue=${stimulInfo.este_pm_cue} | tip=${row.tip_pm}`;
    }
  });

  // Feedback antrenament (nu apare în blocul principal)
  if (esteAntrenament) {
    trialuri.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        const ultim = date_pm[date_pm.length - 1];
        if (!ultim.raspuns_ongoing || ultim.raspuns_ongoing === '') {
          return '<div class="feedback-incorect">PREA TÂRZIU!<br><span style="font-size:26px;">Răspunde mai rapid.</span></div>';
        } else if (ultim.corect_ongoing === 'True') {
          return '<div class="feedback-corect">Răspuns CORECT ✓</div>';
        } else {
          return '<div class="feedback-incorect">Răspuns GREȘIT ✗</div>';
        }
      },
      choices: 'NO_KEYS',
      trial_duration: 600,
      conditional_function: function() {
        return date_pm.length > 0;
      }
    });
  }

  // ISI 300ms
  trialuri.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '',
    choices: 'NO_KEYS',
    trial_duration: 300
  });

  return { timeline: trialuri };
}

// Funcție care construiește un CSV string identic cu format Python
function dictListToCSV(lista, fieldnames) {
  if (!lista.length) return '';
  const escape = v => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    // Dacă conține virgulă, ghilimele sau newline → încadrează în ghilimele
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const lines = [fieldnames.join(',')];
  for (const row of lista) {
    lines.push(fieldnames.map(f => escape(row[f])).join(','));
  }
  return lines.join('\r\n') + '\r\n';
}

// Salvarea finală - se rulează după toate trial-urile

  type: jsPsychCallFunction,
  func: function() {
    // Construiește CSV-urile cu format identic
    const fieldnames_pm = [
      'participant_id', 'conditie', 'focal_cue', 'cognitive_load',
      'cuvant', 'categorie', 'este_pm_cue', 'tip_afisare',
      'raspuns_ongoing', 'raspuns_corect_ongoing', 'corect_ongoing',
      'timp_reactie_ms', 'raspuns_pm', 'corect_pm', 'tip_pm', 'este_antrenament'
    ];

    const csv_pm  = dictListToCSV(date_pm,  fieldnames_pm);

    // Construiește sumar text
    const trials_pm_real = date_pm.filter(t => t.este_pm_cue === 'True' && t.este_antrenament === 'False');
    const hits   = trials_pm_real.filter(t => t.tip_pm === 'hit').length;
    const misses = trials_pm_real.filter(t => t.tip_pm === 'miss').length;
    const trials_non_pm = date_pm.filter(t => t.este_pm_cue === 'False' && t.este_antrenament === 'False');
    const false_alarms = trials_non_pm.filter(t => t.raspuns_pm === 'True').length;
    const ongoing_real = date_pm.filter(t => t.este_antrenament === 'False' && t.raspuns_ongoing !== '');
    const acuratete_ongoing = ongoing_real.length ? ongoing_real.filter(t => t.corect_ongoing === 'True').length / ongoing_real.length : 0;
    const tr_valide = date_pm.filter(t => t.este_antrenament === 'False'
                                       && t.timp_reactie_ms !== ''
                                       && t.corect_ongoing === 'True'
                                       && t.este_pm_cue === 'False');
    const tr_mediu = tr_valide.length ? tr_valide.reduce((s, t) => s + parseFloat(t.timp_reactie_ms), 0) / tr_valide.length : 0;
    const total_cues = trials_pm_real.length;
    const acuratete_pm = total_cues ? hits / total_cues : 0;

    const sumar = `SUMAR EXPERIMENT
========================================
Participant: ${PARTICIPANT_ID}
Condiție: ${CONDITIE_STR}
Focal cue: ${FOCAL_CUE ? 'True' : 'False'}
Cognitive load (deadline): ${HIGH_LOAD ? `True (${DEADLINE_MS}ms)` : `False (${LOWLOAD_MS}ms)`}

SCORURI PM:
  total_pm_cues: ${total_cues}
  hits: ${hits}
  misses: ${misses}
  false_alarms: ${false_alarms}
  acuratete_pm: ${acuratete_pm.toFixed(3)}
  acuratete_ongoing: ${acuratete_ongoing.toFixed(3)}
  timp_reactie_mediu_ms: ${tr_mediu.toFixed(2)}
`;

    // Stocăm fișierele "brute" ca text pentru download local backup
    window.__csv_pm = csv_pm;
    window.__sumar = sumar;
    window.__participant_id = PARTICIPANT_ID;
    window.__conditie = CONDITIE_STR;
    window.__timestamp = TIMESTAMP;

    // Funcție de descărcare locală (backup)
    function downloadCSV(content, filename) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    window.__downloadAllData = function() {
      const base = `data_P${PARTICIPANT_ID}_${CONDITIE_STR}_${TIMESTAMP}`;
      downloadCSV(csv_pm,  base + '.csv');
      downloadCSV(sumar,   base + '_sumar.txt');
    };
  }
});
